[project]
name = "show-vtv"
version = "0.1.0"
description = "Débat IA PyQt6 / QML — Show V.TV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyQt6>=6.0.0",
    "requests>=2.31.0",
    "langchain>=1.2.18",
    "langgraph>=1.1.10",
    "langchain-mistralai>=1.1.4",
    "langchain-openai>=1.2.1",
]

[project.optional-dependencies]
avatars = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]
langgraph-example = [
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: needs network access and/or OPENAI_API_KEY (skipped in CI)",
]

